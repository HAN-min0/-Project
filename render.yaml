services:
  - type: web
    name: travel-review-hanmin0
    runtime: node
    plan: free
    region: singapore
    rootDir: travel-review
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SUPABASE_PROJECT_REF
        sync: false
